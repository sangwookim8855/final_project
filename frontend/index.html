<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>내 상황을 아는 AI 비서</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <h1>🤖 내 상황을 아는 AI 비서</h1>
    <span id="server-status" class="status"></span>
  </header>

  <nav class="tabs">
    <button class="tab active" data-tab="chat">채팅</button>
    <button class="tab" data-tab="data">데이터 관리</button>
    <button class="tab" data-tab="history">대화 기록</button>
    <button class="tab" data-tab="summary">데이터 요약</button>
  </nav>

  <main>
    <!-- 채팅 -->
    <section id="tab-chat" class="panel active">
      <div class="chat-toolbar">
        <span id="chat-title">새 대화</span>
        <button id="new-chat" class="btn small">새 대화</button>
      </div>
      <div id="messages" class="messages"></div>
      <div id="loading" class="loading hidden">AI가 답변을 작성하는 중...</div>
      <form id="chat-form" class="chat-form">
        <input id="chat-input" type="text" maxlength="1000"
               placeholder="예: 이번 달 매출이 어때?" required />
        <button type="submit" class="btn">전송</button>
      </form>
    </section>

    <!-- 데이터 관리 -->
    <section id="tab-data" class="panel">
      <form id="data-form" class="data-form">
        <input type="hidden" id="data-id" />
        <input type="date" id="data-date" required />
        <input type="number" id="data-value" min="0" step="1" placeholder="값(예: 매출 원)" required />
        <input type="text" id="data-memo" maxlength="200" placeholder="메모" />
        <button type="submit" id="data-submit" class="btn">추가</button>
        <button type="button" id="data-cancel" class="btn ghost hidden">수정 취소</button>
      </form>
      <p id="data-msg" class="msg"></p>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>날짜</th><th>값</th><th>메모</th><th>관리</th></tr>
          </thead>
          <tbody id="data-body"></tbody>
        </table>
      </div>
    </section>

    <!-- 대화 기록 -->
    <section id="tab-history" class="panel">
      <div class="history-layout">
        <ul id="conv-list" class="conv-list"></ul>
        <div id="conv-detail" class="conv-detail">
          <p class="muted">대화를 선택하세요.</p>
        </div>
      </div>
    </section>

    <!-- 데이터 요약 -->
    <section id="tab-summary" class="panel">
      <button id="refresh-summary" class="btn small">새로고침</button>
      <div id="summary-card" class="summary-card"></div>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
